name: sigmark-lan
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sigmark
      POSTGRES_DB: sigmark
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - reports:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U sigmark -d sigmark']
      interval: 3s
      timeout: 3s
      retries: 15
  api:
    build: .
    environment:
      DATABASE_URL: postgres://sigmark:${DB_PASSWORD:?Set DB_PASSWORD}@db:5432/sigmark?sslmode=disable
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Set ADMIN_TOKEN}
      REPOSITORY_READ_TOKEN: ${REPOSITORY_READ_TOKEN:-}
      LAN_BATCH: ${LAN_BATCH:-lan-direct}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      BUILD_DATA: /build-data
      BUILD_CATALOG: /build-catalog/versions.json
    volumes:
      - ./build-data:/build-data
      - ./build-catalog:/build-catalog:ro
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '${LAN_BIND:?Set LAN_BIND to the host private IPv4}:${LAN_PORT:-48272}:8080'
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
volumes:
  reports:
